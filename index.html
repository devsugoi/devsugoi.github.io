    <script>
      // Resolve the theme before first paint so there is no flash of the
      // wrong background. Mirrors the logic in src/hooks/useDarkMode.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("dark-theme");
          var dark =
            stored === null
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
              : JSON.parse(stored);
          document.documentElement.classList.toggle("dark", !!dark);
        } catch (e) {
          /* first visit in a locked-down browser: fall through to light */
        }
      })();
    </script>
